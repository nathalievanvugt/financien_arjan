<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mijn financiën - opmaak. Eén laag: elke selector staat er één keer in, elke @media-voorwaarde heeft één blok.
   Waar twee regels hetzelfde element kunnen raken, staan ze nog in dezelfde volgorde als vroeger.
   Gemaakt met dry_css.py en one_layer.py uit de oude 31 ontwerplagen; het beeld is gelijk gebleven. */
*{box-sizing:border-box}
html,body{color:var(--ink)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
h3{font-size:.95rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.83rem}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{display:flex;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);flex-direction:column;gap:18px;background:transparent}
.brand svg{flex:none}
.navlist{display:flex;flex-direction:column;gap:2px}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn .count{margin-left:auto;font-size:.75rem;background:var(--warn-soft);color:var(--warn);border-radius:20px;padding:0 7px;font-weight:600}
.sync{margin-top:auto;padding:0 10px;font-size:.78rem;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pos);flex:none}
.dot.busy{background:var(--warn)}
.dot.err{background:var(--neg)}
.main{min-width:0;padding-inline:40px;padding-block:26px 60px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.tabbar{display:none}
.btn:hover{border-color:var(--ink-3)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger.armed{background:var(--neg);border-color:var(--neg);color:#fff}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=search],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--ink-2);font-weight:500;min-width:0}
label.chk{display:flex;gap:9px;align-items:flex-start;font-size:.9rem;cursor:pointer}
label.chk input{margin-top:3px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.span2{grid-column:1/-1}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h p{font-size:.84rem;color:var(--ink-2)}
.cols{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.empty{padding:26px 10px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.hero-main{padding:26px 28px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;background:var(--surface);color:var(--ink)}
.hero-main .big{font-family:var(--f-display);font-size:clamp(2.2rem,5vw,3rem);font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero-main summary::-webkit-details-marker{display:none}
.hero-main summary::after{content:" ▾"}
.hero-main details[open] summary::after{content:" ▴"}
.calc-lines{margin-top:8px;display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.calc-lines div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.calc-lines .tot{border-top:1px solid color-mix(in srgb,var(--hero-ink) 25%,transparent);margin-top:4px;padding-top:4px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat .hint{font-size:.78rem;color:var(--ink-3)}
button.stat{cursor:pointer;text-align:left;font:inherit;color:inherit}
button.stat:hover{border-color:var(--ink-3)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-3)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
button.pill{border:0;cursor:pointer}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.num,td.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;border-top:1px solid var(--line)}
.tname{font-weight:550}
.tsub{font-size:.8rem;color:var(--ink-3)}
.list{display:flex;flex-direction:column}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
button.li{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit}
.bar i{display:block;height:100%;border-radius:6px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.catlist{display:flex;flex-direction:column;gap:7px;font-size:.88rem}
.catlist div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.catlist span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input[type=search]{max-width:260px}
.toolbar select{width:auto}
.notice{border-radius:var(--r-sm);padding:12px 14px;gap:10px;font-size:.9rem;display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-start}
.notice.bad{background:var(--neg-soft);color:var(--neg)}
dialog.sheet{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog.sheet.wide{width:min(980px,calc(100vw - 24px))}
dialog.sheet::backdrop{background:rgba(10,16,13,.45)}
.sheet-in{display:flex;flex-direction:column;max-height:calc(100dvh - 40px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.sheet-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-f .left{margin-right:auto}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--ink-2);cursor:pointer;background:var(--surface-2)}
.drop.over{border-color:var(--accent);color:var(--accent)}
.progress{display:flex;gap:10px;align-items:center;color:var(--ink-2)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .spin{animation-duration:3s}
}
.pv td{padding:6px 6px}
.pv input,.pv select{padding:6px 8px;font-size:.86rem}
.pv tr.off td{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:.9rem;max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;cursor:pointer;text-decoration:underline}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.kv .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--ink-2);gap:12px}
@media (max-width:980px){
  .hero,.cols{grid-template-columns:minmax(0,1fr)}
}
.txr{display:flex;align-items:center;gap:10px;flex:none}
#txlist .tsub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn.onaccent:hover{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.6)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile .bar{height:5px}
.chip-link{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:3px 10px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.chip-link:hover{border-style:solid}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cand:last-child{border-bottom:0}
.acc-rows{display:flex;flex-direction:column;gap:8px}
.acc-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center}
.acc-row input{text-align:right}
.pots{display:flex;flex-direction:column}
.pot:last-child{border-bottom:0}
.pot:hover{background:var(--surface-2)}
.pot-mid{display:flex;flex-direction:column;gap:3px;min-width:0}
.pot-mid b{font-weight:600}
.pot-mid .bar{height:5px;margin-top:3px;max-width:260px}
.pot-val{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.kpi.k1{background:var(--p3)}
.kpi.k2{background:var(--p2)}
.kpi.k3{background:var(--p1)}
.hero-main::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--hero-glass),rgba(255,255,255,0) 70%);display:none}
.hero-main .lbl{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--accent);opacity:1}
.hero-main .sub{font-size:.92rem;color:var(--ink-2);opacity:1}
.hero-main details{margin-top:10px;border-top:1px solid color-mix(in srgb,var(--hero-ink) 18%,transparent);padding-top:10px;border-top-color:var(--line)}
.btn.onaccent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpi .lbl::before{content:"";width:8px;height:8px;border-radius:50%;flex:none}
.kpi.k1 .lbl::before{background:var(--c3)}
.kpi.k2 .lbl::before{background:var(--c2)}
.kpi.k3 .lbl::before{background:var(--c1)}
.tile:hover{outline-offset:0;outline:none}
.notice,.notice.info{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.notice::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c4);flex:none}
.notice.info::before{background:var(--c1)}
.notice > span{flex:1}
.kpi-d{font-size:.76rem;color:var(--ink-3);font-weight:600;margin-top:2px}
.kpi-d.bad{color:var(--neg)}
.catrow:hover{background:var(--surface-2)}
.ins-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.ins-head > div{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ins-head .lbl{font-size:.76rem;font-weight:600;color:var(--ink-2)}
.ins-head b{font-family:var(--f-display);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.ins-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:7px 0}
.ins-bar .bar{grid-column:1/-1;height:6px}
.brand span{white-space:nowrap}
.ph-ic,i.lg,.stack-bar{display:none}
b.pos{color:var(--pos)}
.res-prog{display:none}
.pot{display:grid;gap:14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%;border-radius:0;grid-template-columns:auto minmax(0,1fr);align-items:start;padding:14px 4px}
.pot .pot-dot{margin-top:2px}
.pot-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pot-top b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pot .goal-l{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--ink-3);margin-top:4px}
.pots-repay{margin-top:28px}
.pots-repay .pr-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;padding:0 4px 4px;border-bottom:1px solid var(--line)}
.pots-repay .pr-h b{font-size:.74rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.pots-repay .pr-h span{font-size:.78rem;color:var(--ink-3)}
.pots-repay .pot{border-bottom:0}
.res-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.res-sum span{font-size:.8rem;color:var(--ink-2);font-weight:550}
.res-sum em{font-style:normal;font-size:.78rem;color:var(--ink-3)}
h2{font-size:1.08rem;font-weight:600;letter-spacing:-.015em}
.card,.stat,.kpi,.tile,.hero-main{border:0 !important;box-shadow:var(--shadow)}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .stat,:root[data-theme="dark"] .kpi,:root[data-theme="dark"] .tile,:root[data-theme="dark"] .hero-main{border:1px solid var(--line) !important}
.tile{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;font:inherit;color:inherit;min-width:0;background:var(--surface) !important}
.tile:hover,button.kpi:hover{border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.08)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.04);color:color-mix(in srgb,var(--pg) 85%,var(--ink))}
button.li:hover{background:var(--surface-2)}
.kpi .lbl::before,.notice::before{display:none}
.bar{height:8px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.brand > svg rect{fill:var(--ink)}
.brand > svg path{stroke:var(--surface)}
.seg{display:inline-flex;gap:2px;flex-wrap:wrap;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:9px;padding:2px}
input,select,textarea{border-radius:10px !important}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;border-radius:20px;padding:2px 9px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);font-weight:500}
.pill.res{background:var(--surface-2);color:var(--ink-2)}
.link{border:0;background:none;padding:0;cursor:pointer;font-weight:550;color:var(--accent)}
.theme-btn{margin-left:auto;display:inline-grid;place-items:center;border-radius:10px;color:var(--ink-2);cursor:pointer;width:30px;height:30px;flex:none;border:0;background:transparent}
.theme-btn:hover{color:var(--ink);background:var(--surface-2)}
.ict svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

   Biedt dezelfde opslag-functies als Claude (db, downloads), maar bewaart alles in localStorage op dit apparaat.

(function () {
  window.LOCAL_EDITION = true;

  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { store = {}; }
  let saveT = null, lastErr = null;
  const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(store)); lastErr = null; }
    catch (e) { lastErr = e; console.error('Opslaan mislukt', e); window.dispatchEvent(new CustomEvent('local-store-error')); }
  }, 60); };
  window.addEventListener('pagehide', () => { if (saveT) { clearTimeout(saveT); try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} } });

  const clone = d => JSON.parse(JSON.stringify(d));
  const subs = new Set();
  const notify = () => setTimeout(() => subs.forEach(f => f()), 0);
  const colDocs = col => Object.keys(store).filter(k => k.startsWith(col + '/') && k.split('/').length === 2)
    .map(k => ({ id: k.split('/')[1], exists: true, data: () => clone(store[k]), metadata: {} }));

  const sal = all('salaries').filter(s => s.payDate && +s.net > 0), m = {};
  sal.forEach(s => { const k = monthKey(s.payDate); (m[k] = m[k] || { k, v: 0, n: 0, exp: false }); m[k].v += +s.net; m[k].n++; });
  const lastPaid = sal.map(s => s.payDate).sort().pop() || today();
  nextPayDates(4).filter(d => d > lastPaid).forEach(d => { const k = monthKey(d); (m[k] = m[k] || { k, v: 0, n: 0, exp: true }); m[k].v += predictSalary(d); m[k].n++; });
  const keys = Object.keys(m).sort(); if (!keys.length) return [];
  const out = []; for (let k = keys[0]; k <= keys[keys.length - 1]; k = monthKey(addMonths(k, 1))) out.push(m[k] || { k, v: 0, n: 0, exp: k > monthKey(lastPaid) });
  // total income = salary + other income in that month (refunds and own transfers excluded); expected extras for future months
  const NOT_INC = ['Salaris', 'Terugbetaling'];
  out.forEach(x => {
    const other = sum(activeTx().filter(t => t.kind === 'inkomst' && !NOT_INC.includes(t.category) && monthKey(t.date) === x.k && !(txKid(t))), t => +t.amount);
    const exp = sum(all('extras').filter(e => e.status !== 'ontvangen' && +e.amount > 0 && e.date && monthKey(e.date) === x.k && x.k >= monthKey(today())), e => +e.amount);

  const X = i => i * W / (d.length - 1), Y = v => T + (1 - v / max) * (H - T - B);

  const tp = d.map((x, i) => [X(i), Y(x.tot || x.v)]), tAct = tp.slice(0, li + 1), tFut = tp.slice(Math.max(0, li));

    const wb = X.read(await file.arrayBuffer(), { type: 'array', cellDates: true });

  if (table[0].length >= 18 && /^\d{2}-\d{2}-\d{4}$/.test(String(table[0][0]).trim()) && /^[A-Z]{2}\d{2}[A-Z]{4}/.test(String(table[0][1]).trim()) && String(table[0][7]).trim() === 'EUR' && String(table[0][9]).trim() === 'EUR' && isFinite(+String(table[0][10]).trim())) {

      return { date: parseDate(String(r[0]).trim()), amount, name, description: desc, balanceAfter: isFinite(before) && isFinite(amount) ? r2(before + amount) : null, ownIban: String(r[1]).trim(), counterIban: String(r[2] || '').trim(), bankCat: unq(r[19]) };
    });

  const hi = table.findIndex(r => r.some(c => /datum|date/i.test(String(c))) && r.some(c => /bedrag|amount|af.?bij|debet|credit/i.test(String(c))));

function abnName(d) {

function csvParse(text) {

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;

/* backup */
const BACKUP_COLS = COLS.filter(c => c !== 'log');
ACT.backup = async () => {
  const data = { app: 'mijn-financien', version: 1, exportedAt: new Date().toISOString(), config: strip(S.config), collections: Object.fromEntries(BACKUP_COLS.map(c => [c, all(c)])) };
  const dl = CAP.downloads || (window.claude?.use ? await window.claude.use('downloads') : null);
  if (!dl) return toast('Downloaden is hier niet beschikbaar.');
  try {
    await dl.save({ filename: `mijn-financien-${today()}.json`, data: JSON.stringify(data, null, 1) });commit('Back-up gemaakt', [{ col: 'config', id: 'main', data: { ...C(), lastBackup: today() } }], { log: false }).catch(() => {});toast('Back-up klaargezet. Er staan je bedragen en rekeningnummers in: bewaar dit bestand veilig.');
  }
  catch (e) { if (e?.code !== 'cancelled' && e?.code !== 'declined') toast('De back-up kon niet worden opgeslagen.'); }
};
/* M3: check the shape of a backup before it replaces anything */
function backupProblems(data) {
  const out = [], isDate = v => v == null || v === '' || /^\d{4}-\d{2}-\d{2}$/.test(v), isNum = v => v == null || v === '' || (typeof v === 'number' && isFinite(v));
  const DATE = ['date', 'payDate', 'balanceDate', 'from', 'start', 'end', 'receivedOn', 'deadline'], NUM = ['amount', 'balance', 'net', 'gross', 'paid', 'received', 'plannedPerPeriod', 'goal', 'intervalDays', 'day', 'month', 'margin', 'km', 'liters', 'price', 'rate', 'hours'];
  for (const c of BACKUP_COLS) {
    const list = data.collections[c]; if (list == null) continue;
    if (!Array.isArray(list)) { out.push(`${c} is geen lijst`); continue; }
    list.forEach((x, i) => {
      if (!x || typeof x !== 'object' || Array.isArray(x)) return out.push(`${c} #${i + 1} is geen record`);
      if (typeof x.id !== 'string' || !/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(x.id)) out.push(`${c} #${i + 1}: ongeldige id`);
      DATE.forEach(k => { if (k in x && !isDate(x[k])) out.push(`${c} ${x.id}: ${k} is geen datum`); });
      NUM.forEach(k => { if (k in x && !isNum(x[k])) out.push(`${c} ${x.id}: ${k} is geen getal`); });
      if ('url' in x && x.url && !/^(https:|\/_blob\/)/.test(x.url)) out.push(`${c} ${x.id}: verdachte link`);
    });
  }
  if (data.config != null && (typeof data.config !== 'object' || Array.isArray(data.config))) out.push('instellingen kloppen niet');
  return out;
}
ACT.restore = () => fileSheet({
  title: 'Back-up terugzetten', accept: 'application/json,.json', multiple: false, hint: 'Kies een back-up die je eerder met "Back-up downloaden" hebt gemaakt. Je huidige gegevens worden daardoor vervangen. Tip: download eerst een back-up van je huidige gegevens.',
  onFiles: async files => {
    let data; try { data = JSON.parse(await files[0].text()); } catch (e) { throw new Error('Dit is geen geldig back-upbestand.'); }
    if (data?.app !== 'mijn-financien' || !data.collections) throw new Error('Dit bestand is geen back-up van deze app.');
    const bad = backupProblems(data); if (bad.length) throw new Error('Deze back-up klopt niet en wordt niet gebruikt: ' + bad.slice(0, 3).join('; ') + (bad.length > 3 ? ` (en nog ${bad.length - 3})` : '') + '.');
    const counts = BACKUP_COLS.map(c => [c, (data.collections[c] || []).length]);
    openSheet({ title: 'Back-up terugzetten', body: `<p>Back-up van ${fmtD((data.exportedAt || '').slice(0, 10))}: ${counts.find(c => c[0] === 'transactions')[1]} transacties, ${counts.find(c => c[0] === 'fixed')[1]} vaste lasten, ${counts.find(c => c[0] === 'reservations')[1]} reserveringen.</p><div class="notice">Alle huidige gegevens worden vervangen door deze back-up. Bestanden zelf blijven staan.</div>`,
      submit: 'Vervangen', onSubmit: async () => {
        const ops = [];
        for (const c of BACKUP_COLS) {
          const incoming = new Map((data.collections[c] || []).filter(x => x && x.id).map(x => [String(x.id), x]));
          all(c).forEach(x => { if (!incoming.has(x.id)) ops.push({ col: c, id: x.id, data: null }); });
          incoming.forEach((x, id) => ops.push({ col: c, id, data: x }));
        }
        if (data.config) ops.push({ col: 'config', id: 'main', data: data.config });
        // M3: same error handling as every other save (local view goes back if saving fails)
        await commit('Back-up teruggezet', ops, { log: false, toastMsg: 'Back-up teruggezet' });
      } });
    return false;
  },
});

      ${F.date('date', 'Saldi aan het eind van', T, { req: 1 })}

        ${F.check('settleFixed', 'Vaste lasten tot deze datum als afgehandeld beschouwen', true)}

/* ================= kalender (dashboard) ================= */
const CAL_C = { salaris: ['Salaris', 'var(--sys-green)'], vast: ['Vaste lasten', MC.fixed], res: ['Reservering', MC.res], aflos: ['Aflossen', '#E8A13A'],
  boodschap: ['Boodschappen', MC.grocery], betaal: ['Betaalrekening', MC.main], sparen: ['Sparen', '#34C77B'], cc: ['Creditcard', MC.cc], tank: ['Tanken', 'var(--sys-cyan)'], inkomst: ['Inkomsten', '#7CC79A'], uit: ['Uitgave', MC.other] };
/* in the calendar every reservation has the same mauve as in the dashboard ring, with its own icon */
const resTileCal = r => resIcon(r).replace(/--fc:[^;"]+/, '--fc:' + MC.res);
const tileColor = html => (String(html).match(/--fc:([^;"]+)/) || [0, MC.other])[1].trim();
const WD = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
const longDay = d => { const x = new Date(d + 'T12:00:00'); return DAYS[x.getDay()] + ' ' + x.getDate() + ' ' + MONTHS[x.getMonth()]; };

/* what happens on each day: real bookings until today, planned items after today */
function calEvents(from, to) {
  const T = today(), ids = freeAccIds();
  const ccAcc = accountsSorted().find(a => a.role === 'creditcard');
  const ev = [];
  const add = (date, name, amount, kind, onSaldo, planned, tile, link) => { if (date >= from && date <= to && Math.abs(amount) >= 0.005) ev.push({ date, name, amount: r2(amount), kind, onSaldo, planned, tile: tile || kindTile('receipt', CAL_C[kind][1]), link: link || null }); };
  // real
  for (const t of activeTx()) {
    if (t.date < from || t.date > to || t.date > T) continue;
    const onFree = ids.includes(t.accountId), toA = t.toAccountId && acc(t.toAccountId);
    if (!onFree && t.accountId !== ccAcc?.id) continue;
    if (t.accountId === ccAcc?.id && t.kind === 'overboeking') continue; // incasso already shown on the bank side
    let kind = 'uit';
    // only what still exists: a payment for a fixed cost or reservation that has since been removed is not shown as one
    const fxOk = t.fixedId && S.fixed.get(t.fixedId), resOk = txResIds(t).some(id => S.reservations.get(id));
    if (t.kind === 'inkomst') kind = t.category === 'Salaris' ? 'salaris' : 'inkomst';
    else if (ccAcc && (t.accountId === ccAcc.id || t.toAccountId === ccAcc.id)) kind = 'cc'; // only when there is a credit card (else undefined === undefined made every payment one)
    else if (fxOk) kind = 'vast';
    else if (toA && isRepay(toA)) kind = 'aflos';
    else if (resOk) kind = 'res';
    else if (isGrocery(toA)) kind = 'boodschap';
    else if (toA && /betaal/i.test(toA.name)) kind = 'betaal';
    else if (t.kind === 'sparen' || isPot(toA)) kind = 'sparen';
    if (t.kind === 'overboeking' && t.amount > 0 && toA && ids.includes(t.accountId)) kind = isGrocery(toA) ? 'boodschap' : kind;
    // the calendar shows fixed costs, reservations, savings and income; loose spending (shop, fuel, ...) stays in Transacties
    if (kind === 'uit' || (kind === 'cc' && !fxOk && !resOk)) continue;
    const r0 = txResIds(t).map(id => S.reservations.get(id)).find(Boolean) || null;
    add(t.date, t.name, t.amount, kind, onFree, false, r0 && !isPot(toA) ? resTileCal(r0) : txTile(t), fxOk ? 'fx:' + t.fixedId : r0 ? 'res:' + r0.id : 'tx:' + t.id);
  }
  // still open on today (due today or earlier): shown on today, so nothing open disappears from the calendar
  for (const r of all('reservations')) { const o = resOpen(r); if (o > 0 && r.date && r.date <= T) add(T, r.name, -o, 'res', true, true, resTileCal(r), 'res:' + r.id); }
  for (const x of all('extras')) if (x.status !== 'ontvangen' && +x.amount > 0 && x.date && x.date <= T) add(T, x.name, +x.amount, 'inkomst', true, true, kindTile('in', MC.income), 'pg:salaris');
  // planned (after today)
  const start = T >= from ? addDays(T, 1) : from;
  if (start <= to) {
    for (let mk = monthKey(addMonths(monthKey(start), -1)); mk <= monthKey(to); mk = addMonths(mk, 1)) for (const f of all('fixed')) {
      const due = fixedDue(f, mk); if (!due || due < start || due > to || !(+f.amount > 0)) continue;
      if (fixedPayment(f, due).paid) continue;
      add(due, f.name + (f.kid ? ' · ' + (kidById(f.kid)?.name || '') : ''), -f.amount, f.accountId === ccAcc?.id ? 'cc' : 'vast', ids.includes(f.accountId) && !(f.kid), true, fxIcon(f), 'fx:' + f.id);
    }
    for (const r of all('reservations')) { const o = resOpen(r); if (!(o > 0 && r.date)) continue;
      if (r.date > T) add(r.date, r.name, -o, 'res', true, true, resTileCal(r), 'res:' + r.id); }
    groceryCalFuture(start, to).forEach(e => add(e.date, 'Boodschappen', -e.amount, 'boodschap', true, true, kindTile('cart', MC.grocery), 'pg:vastelasten'));
    for (const tr of all('transfers').filter(t => t.active !== false && !(isGroceryTransfer(t)))) {
      const a = acc(tr.toAccountId);
      const bs = isGrocery(a);
      transferDates(tr, start, to).forEach(d => add(d, 'Naar ' + (a?.name || ''), -tr.amount, bs ? 'boodschap' : 'betaal', true, true, kindTile(bs ? 'cart' : 'card', bs ? MC.grocery : MC.main), 'pg:sparen'));
    }
    let k = 0;
    for (const d of nextPayDates(3)) {
      if (d < start || d > to) continue;
      add(d, 'Salaris', salaryForPeriod(periodOf(d))[0]?.net ?? predictSalary(d), 'salaris', true, true, kindTile('salaris', MC.salary), 'pg:salaris');
      savingAccounts().filter(a => !ids.includes(a.id) && +a.plannedPerPeriod > 0).forEach(a => add(d, 'Naar ' + a.name, -a.plannedPerPeriod, isRepay(a) ? 'aflos' : 'sparen', !(a.kid), true, kindTile(potIcon(a), potColor(a.id)), 'pg:sparen'));
      k++;
    }
    if (ccAcc) { const b = balance(ccAcc), sd = ccSettleDate(ccAcc); if (b < 0 && sd) add(sd, 'Creditcard incasso', b, 'cc', true, true, kindTile('card', MC.cc), 'pg:transacties'); }

/* ================= Tankwijzer (op de pagina Auto) =================

  ['Bremen', 360], ['Luxemburg', 395], ['Frankfurt', 440], ['Hamburg', 465], ['Parijs', 505], ['Berlijn', 655], ['Kopenhagen', 780], ['München', 830], ['Praag', 880]];

/* everything about the tank, from the bookings and the few things only you know */
function tankModel(T = today()) {
  const car = C().car || {}, calc = car.calc || {}, tk = twSet(), fs = fuelStats();

  const eff = fs.eff || (+calc.efficiency > 0 ? +calc.efficiency : null), effMeasured = !!fs.eff;
  const kmWeek = fs.kmWeek || (+calc.kmWeek > 0 ? +calc.kmWeek : null), kmMeasured = !!fs.kmWeek;
  const lastPrice = [...fuels].reverse().find(f => +f.price > 0)?.price;
  const price = +lastPrice || (+calc.price > 0 ? +calc.price : null);
  const maxL = Math.max(0, ...fuels.map(twLit));
  const size = twNum(tk.size) > 0 ? twNum(tk.size) : null, sizeUsed = size || (maxL ? Math.ceil(maxL) : null);
  const refillL = fulls.length ? sum(fulls, twLit) / fulls.length : sizeUsed ? sizeUsed * (1 - TW_RESERVE) : null;

/* is it worth driving to a cheaper station? */
function detourModel(m = tankModel(), tk = UI.tw || twSet()) {

}

function twChart(d) {
  const W = 300, H = 120, P = 22, maxK = Math.max(10, Math.min(60, Math.ceil(Math.max(d.km * 1.6, d.maxKm * 1.4, 10))));
  const pts = []; for (let i = 0; i <= 40; i++) { const k = maxK * i / 40; pts.push([k, d.net(k)]); }
  const ys = pts.map(p => p[1]).concat([0]), lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const X = k => P + (W - P - 6) * k / maxK, Y = v => 8 + (H - 30) * (hi - v) / span;
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  const be = d.maxKm > 0 && d.maxKm <= maxK ? `<line class="be" x1="${X(d.maxKm)}" x2="${X(d.maxKm)}" y1="6" y2="${H - 22}"/><text x="${X(d.maxKm)}" y="${H - 8}" text-anchor="middle">${nr(d.maxKm, 1)} km</text>` : '';
  const cur = d.net(d.km);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wat je overhoudt bij meer of minder kilometers omrijden">
    <line class="zero" x1="${P}" x2="${W - 6}" y1="${Y(0)}" y2="${Y(0)}"/><text x="${P - 4}" y="${Y(0) + 3}" text-anchor="end">€0</text>
    <path class="ln" d="${line}"/>${be}
    <circle class="pt ${cur > 1 ? 'ja' : cur < -1 ? 'nee' : 'gelijk'}" cx="${X(Math.min(maxK, d.km))}" cy="${Y(cur)}" r="5"/>
    <text x="${P}" y="${H - 8}">0 km</text><text x="${W - 6}" y="${H - 8}" text-anchor="end">${maxK} km</text></svg>
    <span class="tsub">Netto voordeel bij meer of minder omrijden${d.round ? ' (heen en terug)' : ' (enkele reis)'}</span>`;
}

  const weeks = groceryWeeksRaw(g, addDays(g.anchor, -7), addDays(today(), 400)), amts = [...new Set([+g.week, ...weeks.map(w => w.amount)])];
  const map = new Map();

  const handIds = new Set([...map.values()].map(t => t.id));
  activeTx().filter(t => !handIds.has(t.id) && !t.groceryWeek && groceryCand(g, t, amts) && t.date >= addDays(g.anchor, -3)).sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {

const salGotCfg = () => C().salGot || {};

  const d = payDateIn(p.cm);

  const rec = all('salaries').find(s => s.payDate && inP(s.payDate, p));
  const man = salGotCfg()[p.cm];
  const exp = rec ? +rec.net : predictSalary(d);
  return { d, tx, rec, man, amount: tx ? r2(+tx.amount) : man ? r2(+man) : r2(exp), got: !!(tx || man || (rec && rec.payDate <= today())) };
}
/* all income rows of a period */
function incRows(p) {
  const T = today(), TE = dateIn(monthKey(T), 31) /* up to the end of this month it can be ticked off */, rows = [], linked = new Set(all('extras').map(x => x.linkedTxId || x.transactionId).filter(Boolean));
  const s = incSalary(p);
  rows.push({ key: 'sal', date: s.tx ? s.tx.date : s.d, name: 'Salaris', sub: s.tx ? s.tx.name : 'vast salaris', amount: s.amount, icon: ['salaris', MC.salary],

    open: s.rec ? `data-act="editSalary" data-id="${E(s.rec.id)}"` : s.tx ? `data-act="specSalary" data-id="${E(s.tx.id)}"` : `data-act="planSalary" data-d="${E(s.d)}"` });
  const m = mortgageCfg();

      st: g?.tx ? { got: true, how: 'uit bankbestand', date: g.tx.date } : g ? { got: true, how: 'met de hand', undo: `data-act="mortgageTick" data-mk="${mk}" data-undo="1"` } : d <= TE ? { open: `data-act="mortgageTick" data-mk="${mk}"` } : { exp: true },

    actions: { input: salTrioLive, delete: () => saveConfig({ salary: { ...C().salary, changes: (C().salary.changes || []).filter(x => x.id !== c.id) } }, 'Salariswijziging verwijderd') },
    onSubmit: v => { const t = salTrioRead(v), once = v.once === 'once', from = v.from;
      const rest = (C().salary.changes || []).filter(x => x.id !== c?.id && !(x.from === from && !!x.once === once));
      const n = { id: c ? c.id : uid('sal'), from, once, net: t.net, gross: t.gross };
      return saveConfig({ salary: { ...C().salary, mode: 'vast', changes: [...rest, n] } }, `Salaris ${once ? 'alleen' : 'vanaf'} ${salMonthTxt(from)}: ${eur(t.net)}`); } });
};
/* tapping an expected salary in a period: change just that month */
ACT.planSalary = el => ACT.salMonth({ dataset: { mk: monthKey(el.dataset.d) } });
/* 4-11-2026: "Salaris per maand": every month with its salary; tap one to change it, for that month only or also the months after it.
   The fixed salary itself stays as it is; a change is stored in config.salary.changes (once = only that month, otherwise from that month on). */
const salMonthInfo = mk => { const d = payDateIn(mk), net = predictSalary(d), once = salChanges().find(c => c.once && c.from === mk), from = salChanges().find(c => !c.once && c.from === mk), got = incSalary(monthP(mk));
  return { mk, d, net, once, from, got: got.tx ? r2(+got.tx.amount) : got.man ? r2(+got.man) : null }; };
ACT.salMonths = () => {
  const cm = monthKey(today()), ms = []; for (let mk = addMonths(cm, -1); mk <= addMonths(cm, 13); mk = addMonths(mk, 1)) ms.push(salMonthInfo(mk));
  const tag = x => x.once ? '<span class="pill warn">alleen deze maand</span>' : x.from ? '<span class="pill">vanaf deze maand</span>' : '';
  openSheet({ title: 'Salaris per maand', noFoot: true, tapOut: true,
    body: `<div class="list sal-months">${ms.map(x => `<button type="button" class="li" data-act="salMonth" data-list="1" data-mk="${x.mk}"><span class="grow"><b>${cap(salMonthTxt(x.mk))}</b><span class="tsub">${x.got != null ? 'ontvangen · verwacht was ' + eur(x.net) : fmtShort(x.d)}</span></span><span class="num"><b class="${x.got != null ? 'pos' : ''}">${eur(x.got != null ? x.got : x.net)}</b>${tag(x) ? `<span class="tsub">${tag(x)}</span>` : ''}</span></button>`).join('')}</div>
      <p class="small muted" style="margin-top:8px">Netto salaris dat de app per maand verwacht. Tik op een maand om het bedrag te wijzigen: alleen voor die maand, of ook voor de maanden erna. Het vaste salaris (${eur(+C().salary.fixedNet || 0)}) blijft staan; dat wijzig je bij Instellingen › Salaris.</p>` });
};
ACT.salMonth = el => {
  const x = salMonthInfo(el.dataset.mk), has = x.once || x.from, later = salChanges().filter(c => c.from > x.mk);
  const back = () => { if (el.dataset.list) setTimeout(() => ACT.salMonths(), 80); };
  openSheet({ title: 'Salaris ' + salMonthTxt(x.mk), body: `<div class="grid2">${F.money('net', 'Netto bedrag', x.net, { req: 1 })}
      ${F.select('apply', 'Toepassen op', x.from ? 'from' : 'once', [['once', 'Alleen ' + salMonthTxt(x.mk)], ['from', cap(salMonthTxt(x.mk)) + ' en de maanden erna']], { cls: 'span2' })}</div>
      ${later.length ? `<p class="small muted keep" style="margin-top:6px">Latere aanpassingen blijven staan: ${later.map(c => (c.once ? 'alleen ' : 'vanaf ') + salMonthTxt(c.from)).join(', ')}.</p>` : ''}
      <p class="small muted">Uitbetaald rond ${fmtLong(x.d)}${x.got != null ? `; ontvangen: ${eur(x.got)}` : ''}.</p>`,
    extraFoot: has ? '<button type="button" class="btn left" data-act="salMonthReset">Terug naar normaal</button>' : '',
    actions: { salMonthReset: () => { closeSheet(); return saveConfig({ salary: { ...C().salary, changes: (C().salary.changes || []).filter(c => c.from !== x.mk) } }, 'Salaris ' + salMonthTxt(x.mk) + ' weer normaal').then(back); } },
    onSubmit: v => { if (!isFinite(v.net) || !(v.net > 0)) throw new Error('Vul het netto bedrag in.');
      const once = v.apply === 'once', net = r2(v.net), rest = (C().salary.changes || []).filter(c => !(c.from === x.mk && (once ? c.once : true)));
      return saveConfig({ salary: { ...C().salary, mode: 'vast', changes: [...rest, { id: uid('sal'), from: x.mk, once, net, gross: null }] } }, `Salaris ${once ? 'alleen' : 'vanaf'} ${salMonthTxt(x.mk)}: ${eur(net)}`).then(back); } });
};
/* older data: salary set per pay date (salaryPlan) becomes "alleen deze maand" once */
let SAL_MIG = false;
function salPlanMigrate() { const pl = C().salaryPlan || {}, ks = Object.keys(pl).filter(d => pl[d]?.net != null); if (SAL_MIG || BOOT.state !== 'ready' || !ks.length) return; SAL_MIG = true;
  const ch = [...(C().salary.changes || [])]; ks.forEach(d => { const mk = monthKey(d); if (!ch.some(x => x.once && x.from === mk)) ch.push({ id: uid('sal'), from: mk, once: true, net: r2(+pl[d].net), gross: null }); });
  commit('Salaris per maand omgezet', [{ col: 'config', id: 'main', data: { ...C(), salaryPlan: {}, salary: { ...C().salary, changes: ch } } }], { log: false }).catch(e => console.warn(e)); }
{ const base = VIEWS.salaris; VIEWS.salaris = () => { setTimeout(salPlanMigrate, 0); return base(); }; }

/* one time (asked for 31-10-2026): zwemles is per quarter, € 97,50, paid on 30 October 2026 (not every month) */
function zwemFixOps() {
  const cfg = C(); if (!cfg.setupDone || cfg.zwemFix2610) return [];
  const ops = all('fixed').filter(f => /zwem/i.test(f.name) && f.kind === 'maand' && f.kid).map(f => ({ col: 'fixed', id: f.id, data: { ...f, kind: 'kwartaal', amount: 97.5, month: 10, day: 30, paidMonths: { ...(f.paidMonths || {}), '2026-10': true } } }));
  return [...ops, { col: 'config', id: 'main', data: { ...cfg, zwemFix2610: true } }];
}

/* ================= "Hoort bij" (3-11-2026) =================
   One choice instead of Soort + Categorie, in the import and in the transaction form: nothing, a fixed cost, a reservation
   (also a week of the groceries), Nico (his fixed costs, allowances, other), salary, mortgage refund, childcare repayment, or an own account.
   Kind and category follow from the choice; for "nothing" the category the app recognised stays. */
const HB_SPECIAL = ['Salaris', 'Hypotheekaftrek', REPAY_CAT, 'Toeslagen', 'Vaste lasten', 'Abonnementen', 'Reserveringen', 'Eigen overboeking', 'Sparen', 'Creditcard aflossen'];
const hbGroceryAcc = () => accountsSorted().find(a => a.active !== false && isGrocery(a)) || null;
function hbOptions(t, accountId) {
  const amt = +t.amount, out = amt < 0, inn = amt > 0, any = !amt, d = t.date || today(), k = kids()[0], groups = [];
  const g = (label, opts) => { if (opts.length) groups.push([label, opts]); };
  g('', [['', out ? 'Gewone uitgave' : inn ? 'Gewone inkomst' : 'Niets (gewone uitgave of inkomst)']]);
  if (out || any) g('Vaste lasten', all('fixed').filter(f => !f.kid && (f.active !== false || f.id === t.fixedId)).sort((a, b) => a.name.localeCompare(b.name)).map(f => ['fx:' + f.id, f.name]));
  if (out || any) g('Reserveringen', [
    ...groceryWeeks(addDays(d, -10), addDays(d, 10)).filter(w => !w.skip).map(w => ['gw:' + w.date, `Boodschappen ${WEEKDAYS[wdOf(w.date)].slice(0, 2)} ${fmtShort(w.date)}`]),
    ...all('reservations').filter(r => resOpen(r) > 0 || txResIds(t).includes(r.id)).sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(r => ['res:' + r.id, `${r.name}${r.date ? ' · ' + fmtShort(r.date) : ''} · ${eur(r.amount)}`])]);
  if (k) g(k.name, [
    ...((out || any) ? kidCosts(k).filter(f => f.active !== false || f.id === t.fixedId).map(f => ['fx:' + f.id, 'Vaste last: ' + f.name]) : []),
    ...((inn || any) ? (k.incomes || []).map(it => ['inc:' + k.id + ':' + it.id, 'Toeslag: ' + it.name]) : []),
    ['loose:' + k.id, inn ? 'Ander geld voor ' + k.name : 'Andere uitgave voor ' + k.name]]);
  if (inn || any) g('Inkomsten', [['sal', 'Salaris'], ...(mortgageCfg() ? [['hyp', 'Teruggave hypotheekrente']] : []), ...(repayCfg() || t.category === REPAY_CAT ? [['rep', REPAY_CAT]] : [])]);
  g('Eigen rekening', accountsSorted().filter(a => a.active !== false && a.id !== (accountId || t.accountId)).map(a => ['own:' + a.id, (inn ? 'Van ' : out ? 'Naar ' : '') + a.name]));
  return groups;
}
function hbValue(t) {
  if (!t) return '';
  const k = kids()[0];
  if (t.kidItem && k && (k.incomes || []).some(i => i.id === t.kidItem) && !(t.toAccountId)) return 'inc:' + k.id + ':' + t.kidItem;
  if (t.toAccountId && (t.kind === 'overboeking' || t.kind === 'sparen')) return 'own:' + t.toAccountId;
  if (t.groceryWeek) return 'gw:' + t.groceryWeek;
  if (t.fixedId && S.fixed.get(t.fixedId)) return 'fx:' + t.fixedId;
  const r = txResIds(t)[0]; if (r && S.reservations.get(r)) return 'res:' + r;
  if (k && txKid(t) === k.id) return 'loose:' + k.id;
  if (t.category === 'Salaris') return 'sal';
  if (t.category === 'Hypotheekaftrek') return 'hyp';
  if (t.category === REPAY_CAT) return 'rep';
  return '';
}
/* the select; options of another choice than the current one keep the current one visible */
function hbSelect(t, accountId, cur, attrs = '') {
  const groups = hbOptions(t, accountId), has = groups.some(([, o]) => o.some(x => x[0] === cur));
  const opt = ([v, l]) => `<option value="${E(v)}" ${v === cur ? 'selected' : ''}>${E(l)}</option>`;
  return `<select ${attrs}>${!has && cur ? `<option value="${E(cur)}" selected>(huidige koppeling)</option>` : ''}${groups.map(([lab, o]) => lab ? `<optgroup label="${E(lab)}">${o.map(opt).join('')}</optgroup>` : o.map(opt).join('')).join('')}</select>`;
}
/* kind, category and links from the choice; learn (optional) collects what the import remembers for Nico */
function hbApply(doc, v, learn = []) {
  const amt = +doc.amount, base = { ...doc, fixedId: null, reservationId: null, reservationIds: null, toAccountId: null, groceryWeek: null, kidItem: null, kidMk: null };
  const plain = { kind: amt < 0 ? 'uitgave' : 'inkomst', category: HB_SPECIAL.includes(doc.category) || !doc.category ? (amt < 0 ? 'Overig' : 'Inkomsten') : doc.category };
  const noKid = x => kids().length ? kidApply({ ...x, kidOn: false, kidManual: true }, x, []) : x;
  const [type, a, b] = String(v || '').split(':');
  if (!type) return { ...noKid({ ...base, ...plain }), groceryNo: true };
  if (type === 'fx') { const f = S.fixed.get(a); if (!f) return doc;
    if (f.kid) return { ...kidApply({ ...base, kidLink: 'fx:' + f.id, kidOn: true, kidManual: true }, base, learn), groceryNo: true };
    return { ...noKid({ ...base, kind: 'uitgave', category: (f.kind === 'maand' || f.kind === 'aflossen') ? 'Vaste lasten' : (f.kind === 'sparen' || f.kind === 'beleggen') ? 'Sparen' : 'Abonnementen' }), fixedId: f.id, groceryNo: true }; }
  if (type === 'res') return { ...noKid({ ...base, kind: 'uitgave', category: 'Reserveringen' }), reservationId: a, reservationIds: doc.reservationId === a && doc.reservationIds ? doc.reservationIds : null, groceryNo: true };
  if (type === 'gw') { const ga = hbGroceryAcc(); return { ...noKid({ ...base, ...(ga && ga.id !== doc.accountId ? { kind: 'overboeking', category: 'Eigen overboeking', toAccountId: ga.id } : plain) }), groceryWeek: a, groceryNo: null }; }
  if (type === 'inc' || type === 'loose') return { ...kidApply({ ...base, kidLink: v, kidOn: true, kidManual: true }, base, learn), groceryNo: true };
  if (type === 'sal') return { ...noKid({ ...base, kind: 'inkomst', category: 'Salaris' }), groceryNo: true };
  if (type === 'hyp') return { ...noKid({ ...base, kind: 'inkomst', category: 'Hypotheekaftrek' }), groceryNo: true };
  if (type === 'rep') return { ...noKid({ ...base, kind: 'inkomst', category: REPAY_CAT }), groceryNo: true };
  if (type === 'own') { const to = acc(a); if (!to) return doc; const own = kids()[0] && kidOwnAcc(kids()[0]);
    const out = { ...base, kind: isPot(to) ? 'sparen' : 'overboeking', category: isPot(to) ? 'Sparen' : 'Eigen overboeking', toAccountId: to.id, kid: null, kidNoMove: null };
    return { ...(own && to.id === own.id ? out : noKid(out)), toAccountId: to.id, kind: out.kind, category: out.category, groceryNo: isGrocery(to) ? null : true }; }
  return doc;
}

/* one time (asked for 4-11-2026): "Beleggen …" set as an ordinary monthly cost becomes the kind Beleggen, so Sparen shows it too */
function belegFixOps() {
  const cfg = C(); if (!cfg.setupDone || cfg.belegFix0411) return [];
  const ops = all('fixed').filter(f => /beleg/i.test(f.name || '') && (f.kind === 'maand' || !f.kind)).map(f => ({ col: 'fixed', id: f.id, data: { ...f, kind: 'beleggen' } }));
  return [...ops, { col: 'config', id: 'main', data: { ...cfg, belegFix0411: true } }];
}

readHash();
